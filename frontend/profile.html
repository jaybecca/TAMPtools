<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — TAMPtools</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head><body class="app-layout"><main class="app-main"><div class="page-wrap"><section class="page-title"><div><p class="eyebrow">ACCOUNT</p><h1>Profile</h1><p class="muted">Your stored account details.</p></div></section><section class="profile-grid"><article class="panel"><div class="profile-avatar" id="profileAvatar">?</div><h2 id="profilePageName">Loading…</h2><p id="profilePageEmail" class="muted">Loading…</p><div class="profile-details"><div><span>Name</span><strong id="profileDetailName">—</strong></div><div><span>Email</span><strong id="profileDetailEmail">—</strong></div><div><span>Plan</span><strong id="profileDetailPlan">—</strong></div><div><span>Account status</span><strong id="profileDetailStatus">—</strong></div></div><div class="stack-actions"><a class="btn btn-primary" href="/settings.html">Settings</a><a class="btn btn-soft" href="/dashboard.html">Back to workspace</a></div></article></section></div></main><script>document.addEventListener('DOMContentLoaded',async()=>{try{const r=await fetch('/api/auth/me',{credentials:'include'});if(!r.ok){location.href='/signin.html?next=/profile.html';return}const d=await r.json(),u=d.user||{};const initials=String(u.name||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();document.getElementById('profileAvatar').textContent=initials||'?';document.getElementById('profilePageName').textContent=u.name||'Account';document.getElementById('profilePageEmail').textContent=u.email||'';document.getElementById('profileDetailName').textContent=u.name||'Not stored';document.getElementById('profileDetailEmail').textContent=u.email||'Not stored';document.getElementById('profileDetailPlan').textContent=d.plan?.name||u.plan||'Free';document.getElementById('profileDetailStatus').textContent=u.trial?'Trial active':'Active';}catch{location.href='/signin.html?next=/profile.html'}});</script></body></html>
