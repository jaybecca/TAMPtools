<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZIP & File Toolkit — TAMPtools</title><link rel="stylesheet" href="/styles.css"></head><body><main class="p3-page"><header class="p3-topbar"><a class="brand" href="/dashboard.html"><img src="/logo.png" alt="TAMPtools"></a><a class="btn btn-soft" href="/files.html">Storage Manager</a></header><section class="workspace-shell"><div class="workspace-head"><div><span class="eyebrow">FILES & ZIP</span><h1>ZIP & File Toolkit</h1><p>Select stored files and package them into a clean ZIP download.</p></div></div><div class="panel" style="padding:22px"><div id="list" class="file-grid"></div><div style="display:flex;gap:10px;align-items:center;margin-top:20px"><input id="name" class="input" value="tamptools-package.zip" placeholder="Package name"><button id="zip" class="btn btn-primary">Create ZIP</button></div><p id="msg" class="form-message"></p></div></section></main><script>const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o={}){const r=await fetch(u,{credentials:'include',...o});if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.error||'Request failed')}return r.json()}async function load(){const d=await api('/api/files');$('list').innerHTML=(d.files||[]).map(f=>`<label class="file-card"><input class="zip-check" type="checkbox" value="${f.id}"><div class="file-icon">ZIP</div><div class="file-info"><strong>${esc(f.filename)}</strong><small>${(f.sizeBytes/1048576).toFixed(2)} MB</small></div></label>`).join('')||'<div class="empty-state">No stored files.</div>'}$('zip').onclick=async()=>{const ids=[...document.querySelectorAll('.zip-check:checked')].map(x=>Number(x.value));if(!ids.length)return $('msg').textContent='Select files first.';try{const d=await api('/api/zip/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,filename:$('name').value})});$('msg').innerHTML=`ZIP ready: <a href="${d.file.downloadUrl}">Download ${esc(d.file.filename)}</a>`}catch(e){$('msg').textContent=e.message}};load();</script></body></html>
