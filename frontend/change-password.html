<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change password — TAMPtools</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head><body><main class="auth-page"><section class="auth-art"><a class="brand" href="/index.html"><img src="/logo.png" alt="TAMPtools"></a><div><p class="eyebrow" style="color:#ff9b65">ACCOUNT SECURITY</p><h1>Keep your account protected.</h1><p>Change your password while signed in. Existing sessions are invalidated and a fresh session is issued.</p></div><a class="back-home" href="/dashboard.html">← Back to dashboard</a></section><section class="auth-form-side"><div class="auth-card"><button class="icon-btn theme-toggle" type="button" style="float:right">☾</button><p class="eyebrow">SECURITY</p><h1>Change password</h1><p class="lead">Use a new password you have not used before.</p><form id="changePasswordForm"><div class="field"><label>Current password<div class="password-row"><input id="currentPassword" type="password" autocomplete="current-password" required><button class="toggle" type="button" data-toggle="currentPassword">Show</button></div></label></div><div class="field"><label>New password<div class="password-row"><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required><button class="toggle" type="button" data-toggle="newPassword">Show</button></div></label></div><div class="field"><label>Confirm new password<div class="password-row"><input id="confirmNewPassword" type="password" minlength="8" autocomplete="new-password" required><button class="toggle" type="button" data-toggle="confirmNewPassword">Show</button></div></label></div><button class="btn btn-primary" type="submit">Change password</button><p id="changePasswordMessage" class="form-message" role="status"></p></form><div class="auth-links"><a href="/dashboard.html">Dashboard</a> · <a href="/index.html">Home</a></div></div></section></main></body></html>
