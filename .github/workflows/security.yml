name: TAMPtools DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run product validation
        run: npm run check
      - name: Install PDF system tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript python3-pip && python3 -m pip install --break-system-packages pypdf
      - name: Run backend test suite
        run: npm test
      - run: node --check src/server.js
      - name: Install Gitleaks and scan repository history
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp
          /tmp/gitleaks detect --source . --log-opts="--all --no-merges" --redact --exit-code=2 --report-format=sarif --report-path=gitleaks.sarif
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
