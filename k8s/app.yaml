apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tamptools-data
  namespace: tamptools
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tamptools
  namespace: tamptools
  labels:
    app: tamptools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tamptools
  template:
    metadata:
      labels:
        app: tamptools
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: tamptools:ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: tamptools-config
            - secretRef:
                name: tamptools-runtime
          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: app-data
              mountPath: /app/frontend/uploads/ads
              subPath: ads
            - name: tmp
              mountPath: /tmp
            - name: node-cache
              mountPath: /home/node/.cache
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: tamptools-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: node-cache
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tamptools
  namespace: tamptools
spec:
  type: ClusterIP
  selector:
    app: tamptools
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tamptools-worker
  namespace: tamptools
  labels:
    app: tamptools-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tamptools-worker
  template:
    metadata:
      labels:
        app: tamptools-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: tamptools:ci
          imagePullPolicy: IfNotPresent
          command: ["node", "src/worker.js"]
          workingDir: /app/backend
          envFrom:
            - configMapRef:
                name: tamptools-config
            - secretRef:
                name: tamptools-runtime
          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: tamptools-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
